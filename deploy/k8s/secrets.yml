apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: agent-system
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://agent_user:CHANGE_ME@postgres:5432/agent_db"
  redis-url: "redis://:CHANGE_ME@redis:6379/0"
  jwt-secret: "CHANGE_ME_TO_RANDOM_64_CHARS"
  fernet-key: "CHANGE_ME_TO_FERNET_KEY"
  pg-user: "agent_user"
  pg-password: "CHANGE_ME"
