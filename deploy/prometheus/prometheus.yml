global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 应用指标
  - job_name: "agent-system-backend"
    metrics_path: "/api/v1/monitoring/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "agent-system"

  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter（可选）
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
