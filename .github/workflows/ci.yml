name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # 后端：lint + test
  # ============================================================
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_pass_2024
          POSTGRES_DB: agent_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U agent
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Lint 检查 (ruff)
        run: ruff check app/ tests/

      - name: 运行测试
        env:
          DATABASE_URL: postgresql+asyncpg://agent:agent_pass_2024@localhost:5432/agent_system
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/ -v --tb=short -x

  # ============================================================
  # 前端：typecheck + build
  # ============================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build

  # ============================================================
  # 安全性扫描（依赖漏洞）
  # ============================================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 后端依赖审计
        uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: backend/requirements.txt

      - name: 前端依赖审计
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm audit --audit-level=high
        continue-on-error: true
