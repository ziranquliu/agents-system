services:
  # ============================================================
  # PostgreSQL 17 - 主数据库
  # ============================================================
  agent-postgres:
    image: postgres:17-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_USER: agent
      # 开发默认密码；生产环境请通过环境变量覆盖（如: docker compose --env-file .env up）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_pass_2024}
      POSTGRES_DB: agent_system
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ============================================================
  # Redis 7 - 缓存 / 会话 / 任务队列
  # ============================================================
  agent-redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-network

  # ============================================================
  # Qdrant - 向量数据库 (语义搜索 / 记忆存储)
  # ============================================================
  agent-qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - ../data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agent-network

  # ============================================================
  # pgAdmin - 数据库管理面板 (开发用)
  # ============================================================
  agent-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agent-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agents.local
      # 开发默认密码；生产环境请通过环境变量覆盖
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_2024}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ../data/pgadmin:/var/lib/pgadmin
    depends_on:
      agent-postgres:
        condition: service_healthy
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
